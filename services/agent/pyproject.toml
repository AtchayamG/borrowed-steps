[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "borrowed-steps-agent"
version = "0.1.0"
description = "Borrowed Steps M1 API: community mobility equipment loan workflow (local, persisted, no agent inference)."
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "pydantic==2.13.5",
    "uvicorn==0.52.4",
]

[project.optional-dependencies]
# Only needed when BS_ASSISTANT_ENABLED is true. The structured M1 workflow runs
# with none of this installed.
assistant = [
    "strands-agents[ollama]==1.54.0",
]
dev = [
    "httpx==0.28.1",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.6",
    "strands-agents[ollama]==1.54.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ANN", "B", "C4", "E", "F", "I", "N", "PT", "RUF", "SIM", "TID", "UP", "W"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = ["src", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
